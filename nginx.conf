server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Route all requests to index.html for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}